<svg width="100%" viewBox="0 0 680 424" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>FlowControl closed-loop control sequence</title>
<desc>Flowchart showing the repeating control loop: read flow, compare to target, adjust pump speed, send command to Arduino, then repeat.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="424" fill="#ffffff"/>

<rect x="200" y="40" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Read flow</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">From sensor via serial</text>
<line x1="340" y1="96" x2="340" y2="136" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="200" y="136" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Compare to target</text>
<text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Measured vs setpoint</text>
<line x1="340" y1="192" x2="340" y2="232" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="200" y="232" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Adjust pump speed</text>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Step up or down</text>
<line x1="340" y1="288" x2="340" y2="328" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="200" y="328" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Send command</text>
<text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">SPEED to Arduino</text>

<path d="M480 356 C600 356 600 68 480 68" fill="none" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow2)"/>
<text x="495" y="212" font-family="sans-serif" font-size="12" fill="#5F5E5A">&#8635; repeats</text>
</svg>
