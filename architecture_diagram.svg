<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>FlowControl system architecture</title>
<desc>The Python control app connects over USB to an Arduino Mega running C++ firmware, which drives relays for pumps and valves, a PWM module for pump speed, and reads the flow sensor. A separate PSI reader also connects over USB.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

<rect x="210" y="40" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">FlowControl app</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Python desktop app</text>

<line x1="280" y1="96" x2="200" y2="140" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="400" y1="96" x2="480" y2="140" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="90" y="140" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="200" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Arduino Mega</text>
<text x="200" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">C++ firmware</text>

<rect x="390" y="140" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="480" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">PSI reader</text>
<text x="480" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Pressure, USB</text>

<line x1="200" y1="196" x2="125" y2="240" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="200" y1="196" x2="315" y2="240" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="200" y1="196" x2="505" y2="240" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="40" y="240" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Relays</text>
<text x="125" y="276" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Pumps &amp; valves</text>

<rect x="230" y="240" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="315" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">PWM module</text>
<text x="315" y="276" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Pump 1 speed</text>

<rect x="420" y="240" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="505" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Flow sensor</text>
<text x="505" y="276" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">4-20mA via A0</text>

<text x="340" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Purple = software  ·  Teal = firmware  ·  Gray = hardware</text>
</svg>
